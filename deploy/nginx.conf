# =====================================================================
# PerPress 前端静态 + API/Agent 反向代理
# =====================================================================
server {
    listen 80;
    server_name _;
    client_max_body_size 512m;

    # 前端静态资源（deploy/dist 由部署脚本拷入）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 管理面 API 与 SSE
    location /api/ {
        proxy_pass http://per-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Agent 面（注册/心跳/轮询/指标上报/文件下载/安装脚本）
    location /agent/ {
        proxy_pass http://per-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
