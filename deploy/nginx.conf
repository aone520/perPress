# =====================================================================
# PerPress 前端静态 + API/Agent 反向代理
#
# 上游解析：resolver + 变量 proxy_pass（每请求动态解析 per-server），
# 避免 server 容器重建换 IP 后 nginx 缓存旧地址导致 502
# （Docker 内置 DNS 127.0.0.11，10s 重查一次）
# =====================================================================
server {
    listen 80;
    server_name _;
    client_max_body_size 512m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # 前端静态资源（deploy/dist 由部署脚本拷入）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 管理面 API 与 SSE
    location /api/ {
        set $upstream_server http://per-server:8080;
        proxy_pass $upstream_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Agent 面（注册/心跳/轮询/指标上报/文件下载/安装脚本）
    location /agent/ {
        set $upstream_server http://per-server:8080;
        proxy_pass $upstream_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
