# =====================================================================
# PerPress 主程序部署 compose：mysql + per-server + nginx(前端/反代)
# 部署步骤：
#   1. cp .env.example .env 并修改实际配置
#   2. 将前端构建产物放到 ./dist 目录（可选，没有则只有 API）
#   3. docker compose up -d
# =====================================================================
services:
  per-mysql:
    image: mysql:8.0
    container_name: per-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-perpress@2026}
      MYSQL_DATABASE: per_press
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - per-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-perpress@2026}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [per-net]

  per-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: per-server:latest
    container_name: per-server
    restart: always
    depends_on:
      per-mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # 数据源指向 compose 内 mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://per-mysql:3306/per_press?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-perpress@2026}
      # 文件存储目录（容器内路径，挂载 per-server-data 卷持久化）
      PER_STORAGE_DIR: /data
      # 平台对外访问地址（Agent 注册/心跳/下载文件用，必须是各节点可访问的实际 IP 或域名）
      PER_SERVER_BASE_URL: ${PER_PUBLIC_URL:-http://127.0.0.1}
      # JWT 密钥（生产环境务必修改）
      PER_JWT_SECRET: ${PER_JWT_SECRET:-perpress-secret-key-please-change-in-production-0123456789}
    volumes:
      - per-server-data:/data
    ports:
      # 直接暴露 8080 供 Agent 连接（不经过 nginx，下载大文件更高效）
      - "${PER_SERVER_PORT:-8080}:8080"
    networks: [per-net]

  per-nginx:
    image: nginx:alpine
    container_name: per-nginx
    restart: always
    depends_on: [per-server]
    ports:
      - "${PER_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    networks: [per-net]

volumes:
  per-mysql-data:
  per-server-data:

networks:
  per-net:
